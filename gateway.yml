server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            # =========================
            # ALUMNO
            # =========================
            - id: alumnos
              uri: lb://MS-ALUMNOS
              predicates:
                - Path=/api/alumnos/**

            # =========================
            # ADMINISTRACION
            # =========================
            - id: administracion
              uri: lb://ADMINISTRACION
              predicates:
                - Path=/api/administracion/**

            # =========================
            # CURSOS
            # =========================
            - id: cursos
              uri: lb://CURSOS
              predicates:
                - Path=/api/cursos/**

            # =========================
            # SWAGGER ALUMNO
            # =========================
            - id: swagger-alumnos-ui
              uri: lb://MS-ALUMNOS
              predicates:
                - Path=/alumnos/swagger-ui/**
              filters:
                - StripPrefix=1

            - id: swagger-alumnos-api
              uri: lb://MS-ALUMNOS
              predicates:
                - Path=/alumnos/v3/api-docs/**
              filters:
                - StripPrefix=1

            # =========================
            # SWAGGER ADMINISTRACION
            # =========================
            - id: swagger-administracion-ui
              uri: lb://ADMINISTRACION
              predicates:
                - Path=/administracion/swagger-ui/**
              filters:
                - StripPrefix=1

            - id: swagger-administracion-api
              uri: lb://ADMINISTRACION
              predicates:
                - Path=/administracion/v3/api-docs/**
              filters:
                - StripPrefix=1

            # =========================
            # SWAGGER CURSOS
            # =========================
            - id: swagger-cursos-ui
              uri: lb://CURSOS
              predicates:
                - Path=/cursos/swagger-ui/**
              filters:
                - StripPrefix=1

            - id: swagger-cursos-api
              uri: lb://CURSOS
              predicates:
                - Path=/cursos/v3/api-docs/**
              filters:
                - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    lease-renewal-interval-in-seconds: 10

management:
  endpoints:
    web:
      exposure:
        include: "*"
