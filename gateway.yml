server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            # ========================================
            # API ALUMNO
            # ========================================
            - id: alumnos
              uri: lb://MS-ALUMNOS
              predicates:
                - Path=/api/alumnos/**

            # ========================================
            # API ADMINISTRACION
            # ========================================
            - id: administracion
              uri: lb://MS-ADMINISTRACION
              predicates:
                - Path=/api/administracion/**

            # ========================================
            # API CURSOS
            # ========================================
            - id: cursos
              uri: lb://CURSOS
              predicates:
                - Path=/api/cursos/**

            # ========================================
            # SWAGGER ADMINISTRACION
            # ========================================
            - id: swagger-admin
              uri: lb://MS-ADMINISTRACION
              predicates:
                - Path=/swagger-ui/**

            - id: swagger-admin-api
              uri: lb://MS-ADMINISTRACION
              predicates:
                - Path=/v3/api-docs/**

# ========================================
# EUREKA
# ========================================
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    lease-renewal-interval-in-seconds: 10
