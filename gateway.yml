server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            # ========================================
            # API - ALUMNO
            # ========================================
            - id: alumnos
              uri: lb://MS-ALUMNOS
              predicates:
                - Path=/api/alumnos/**

            # ========================================
            # API - ADMINISTRACION
            # ========================================
            - id: administracion
              uri: lb://MS-ADMINISTRACION
              predicates:
                - Path=/api/administracion/**

            # ========================================
            # API - CURSOS
            # ========================================
            - id: cursos
              uri: lb://MS-CURSOS
              predicates:
                - Path=/api/cursos/**

            # ========================================
            # SWAGGER - ALUMNO
            # ========================================
            - id: swagger-alumnos-ui
              uri: lb://MS-ALUMNOS
              predicates:
                - Path=/alumnos/swagger-ui/**
              filters:
                - StripPrefix=1
                - AddRequestHeader=X-Forwarded-Prefix,/alumnos

            - id: swagger-alumnos-api
              uri: lb://MS-ALUMNOS
              predicates:
                - Path=/alumnos/v3/api-docs/**
              filters:
                - StripPrefix=1
                - AddRequestHeader=X-Forwarded-Prefix,/alumnos

            # ========================================
            # SWAGGER - ADMINISTRACION
            # ========================================
            - id: swagger-administracion-ui
              uri: lb://MS-ADMINISTRACION
              predicates:
                - Path=/administracion/swagger-ui/**
              filters:
                - StripPrefix=1
                - AddRequestHeader=X-Forwarded-Prefix,/administracion

            - id: swagger-administracion-api
              uri: lb://MS-ADMINISTRACION
              predicates:
                - Path=/administracion/v3/api-docs/**
              filters:
                - StripPrefix=1
                - AddRequestHeader=X-Forwarded-Prefix,/administracion

            # ========================================
            # SWAGGER - CURSOS
            # ========================================
            - id: swagger-cursos-ui
              uri: lb://MS-CURSOS
              predicates:
                - Path=/cursos/swagger-ui/**
              filters:
                - StripPrefix=1
                - AddRequestHeader=X-Forwarded-Prefix,/cursos

            - id: swagger-cursos-api
              uri: lb://MS-CURSOS
              predicates:
                - Path=/cursos/v3/api-docs/**
              filters:
                - StripPrefix=1
                - AddRequestHeader=X-Forwarded-Prefix,/cursos

# ========================================
# EUREKA
# ========================================
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    lease-renewal-interval-in-seconds: 10
