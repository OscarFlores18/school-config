server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:

            - id: alumnos
              uri: lb://MS-ALUMNOS
              predicates:
                - Path=/api/alumnos/**

            - id: cursos
              uri: lb://MS-CURSOS
              predicates:
                - Path=/api/cursos/**

            - id: administracion
              uri: lb://MS-ADMINISTRACION
              predicates:
                - Path=/api/administracion/**

eureka:
  instance:
    lease-renewal-interval-in-seconds: 10
